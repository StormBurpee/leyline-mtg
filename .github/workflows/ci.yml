name: Engine & client
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run cards:check
      - run: npm run check
      - name: Browser script formatting diagnostic
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          npx prettier --write scripts/qa-hand.mjs
          git diff -- scripts/qa-hand.mjs
      - run: npm run format:check
      - run: npm run build
      - name: Install browser check tooling
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Inspect responsive hands in Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node scripts/qa-hand.mjs
