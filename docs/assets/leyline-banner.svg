<text x="76" y="486" fill="#92a086" font-family="monospace" font-size="11" letter-spacing="1.3">DETERMINISTIC BY CONSTRUCTION</text><text x="1364" y="486" fill="#92a086" font-family="monospace" font-size="11" letter-spacing="1.3" text-anchor="end">SMALL RULES KERNEL. EXPLICIT BOUNDARIES.</text>
