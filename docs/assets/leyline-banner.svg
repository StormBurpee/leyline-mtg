<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">Leyline — a JavaScript rules engine for Magic</title><desc id="desc">An original geometric mark, warm ivory lettering and a diagram of priority, the stack and state on a dark forest background.</desc>
<defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#82927a" stroke-opacity=".07"/></pattern><linearGradient id="fade"><stop stop-color="#17241c"/><stop offset="1" stop-color="#101712"/></linearGradient><linearGradient id="card"><stop stop-color="#283a2b"/><stop offset="1" stop-color="#1a271e"/></linearGradient></defs>
