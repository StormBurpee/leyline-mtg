<text x="68" y="240" font-family="Georgia,serif" font-size="142" letter-spacing="-7" fill="#e8e9dc">leyline</text>
<text x="76" y="300" font-family="Georgia,serif" font-size="30" fill="#d5c08f">A JavaScript rules engine for Magic.</text>
<text x="77" y="346" font-family="Arial,sans-serif" font-size="16" fill="#a2b19a">Understand the state. Follow the stack. Find your line.</text>
